services:
  seretiny:
    build: .
    restart: unless-stopped
    # Accessible localement par Nginx/Caddy, pas directement depuis Internet.
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /data
      BODY_SIZE_LIMIT: 120M
      # En-têtes ajoutés UNIQUEMENT par le reverse proxy local de confiance.
      PROTOCOL_HEADER: x-forwarded-proto
      HOST_HEADER: x-forwarded-host
      ADDRESS_HEADER: x-forwarded-for
      XFF_DEPTH: 1
    volumes:
      - seretiny_data:/data
volumes:
  seretiny_data:
